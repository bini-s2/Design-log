name: Add Work Log

on:
  workflow_dispatch:
    inputs:
      title:
        description: "기록 제목"
        required: true
        type: string
      category:
        description: "카테고리"
        required: true
        default: "Design"
        type: choice
        options:
          - Design
          - UXUI
          - Blog
          - Study
          - Frontend
          - AI
          - Automation
          - Creative
          - Other
      summary:
        description: "한 줄 요약"
        required: true
        type: string
      details:
        description: "상세 메모 (선택)"
        required: false
        type: string
      link:
        description: "관련 링크 (선택)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: design-log-writes
  cancel-in-progress: false

jobs:
  add-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add work log
        env:
          LOG_TITLE: ${{ inputs.title }}
          LOG_CATEGORY: ${{ inputs.category }}
          LOG_SUMMARY: ${{ inputs.summary }}
          LOG_DETAILS: ${{ inputs.details }}
          LOG_LINK: ${{ inputs.link }}
          LOG_SOURCE: GitHub Button
        run: python scripts/log_activity.py

      - name: Rebuild activity index
        run: python scripts/rebuild_readme.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No new log to commit."
            exit 0
          fi
          git config user.name "design-log-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md logs/
          git commit -m "log: ${{ inputs.title }}"
          git push
