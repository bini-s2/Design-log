name: Add Work Log

on:
  workflow_dispatch:
    inputs:
      title:
        description: "기록 제목 (사람·브랜드·기관·프로젝트 고유명사 및 감정 표현 금지)"
        required: true
        type: string
      category:
        description: "카테고리"
        required: true
        default: "Design"
        type: choice
        options:
          - Design
          - UXUI
          - Blog
          - Study
          - Frontend
          - AI
          - Automation
          - Creative
          - Other
      summary:
        description: "객관적 작업 요약 (식별 정보·감정 표현 금지)"
        required: true
        type: string
      details:
        description: "기술적 상세 메모만 입력 (선택)"
        required: false
        type: string
      link:
        description: "식별 정보가 없는 공개 링크만 입력 (선택)"
        required: false
        type: string
      privacy_checked:
        description: "실명·브랜드·기관·식별 가능한 대상·감정 표현이 없음을 확인"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: design-log-writes
  cancel-in-progress: false

jobs:
  add-log:
    runs-on: ubuntu-latest
    steps:
      - name: Verify privacy confirmation
        if: ${{ !inputs.privacy_checked }}
        run: |
          echo "Privacy confirmation is required."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add work log
        env:
          LOG_TITLE: ${{ inputs.title }}
          LOG_CATEGORY: ${{ inputs.category }}
          LOG_SUMMARY: ${{ inputs.summary }}
          LOG_DETAILS: ${{ inputs.details }}
          LOG_LINK: ${{ inputs.link }}
          LOG_SOURCE: GitHub Button
        run: python scripts/log_activity.py

      - name: Rebuild activity index
        run: python scripts/rebuild_readme.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No new log to commit."
            exit 0
          fi
          git config user.name "design-log-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md logs/
          git commit -m "log: add work activity"
          git push
