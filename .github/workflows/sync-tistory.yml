name: Sync Publishing Activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-log-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync publishing activity
        run: python scripts/sync_tistory.py

      - name: Rebuild activity index
        run: python scripts/rebuild_readme.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No new publishing activity."
            exit 0
          fi
          git config user.name "design-log-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md logs/ .automation/
          git commit -m "log: add publishing activity"
          git push
